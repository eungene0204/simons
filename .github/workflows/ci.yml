name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # 수동 재배포용

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 엔진 핵심 파일이 바뀌었는데 ENGINE_VERSION은 그대로면 실패시켜, 버전 올리는 걸
  # 잊지 않도록 상기시킨다(리마인더). major/minor 판단은 사람이 하므로 자동 갱신은 안 한다.
  # 우회: 결과 불변 리팩터/주석/로깅이면 커밋 메시지에 [skip-version-bump] 표기.
  engine-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # base/head 커밋 이력 필요
      - name: Remind to bump ENGINE_VERSION when engine core changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # 새 브랜치 최초 push 등 base가 비어있거나 0이면 직전 커밋과 비교
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^" 2>/dev/null || echo "$HEAD")"
          fi
          bash scripts/check_engine_version_bump.sh "$BASE" "$HEAD"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate          # lint/vitest가 @prisma/client 타입 필요
      - run: npm run lint
      - run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    services:                              # 앱 DB(Supabase Postgres) 대역 — 로컬 simons_test와 동일 자격증명
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simons
          POSTGRES_PASSWORD: simons
          POSTGRES_DB: simons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U simons"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:                                   # polars/torch 데드락·중복 OpenMP 가드 (起動 데드락 회피)
      KMP_DUPLICATE_LIB_OK: 'TRUE'
      OMP_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps (torch CPU wheel first, Dockerfile와 동일 전략)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-news-v2.txt
          pip install pytest==9.0.3 pytest-asyncio==1.3.0   # 테스트 러너(requirements 미선언) — async 테스트 16파일이 @pytest.mark.asyncio 사용
      - name: Apply app DB schema to test Postgres
        run: |
          command -v psql >/dev/null || (sudo apt-get update -y && sudo apt-get install -y postgresql-client)
          psql "postgresql://simons:simons@localhost:5432/simons_test" -f prisma/migrations/0_init/migration.sql
      - name: Run safe test subset (CLAUDE.md 문서화 명령)
        working-directory: backend
        run: |
          pytest tests/ \
            --ignore=tests/test_backtest_engine.py \
            --ignore=tests/test_engine_ai.py \
            --ignore=tests/test_ai_sell.py \
            --ignore=tests/test_api_isolation.py \
            --deselect tests/test_ai_runtime_latency.py::test_mlx_parse_requires_startup_loaded_model \
            --deselect tests/test_coach_routes.py::test_coach_strategy_reuses_backend_cache \
            --deselect tests/test_multi_reasons.py::test_multiple_reasons \
            --deselect tests/test_regression_fixes.py::test_virtual_trader_handles_none_risk_values_without_crashing \
            -q
        # --deselect: CI에 없는 인프라 의존 4건 — gitignored SQLite DB(코치/가상트레이더),
        # gitignored OHLCV parquet(multi_reasons), Mac 전용 MLX 백엔드(503 vs 500). 로컬에선 통과.

  deploy:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-vultr           # 배포 중첩 방지
      cancel-in-progress: false
    steps:
      - name: Deploy to Vultr box over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_SSH_HOST }}
          username: ${{ secrets.VULTR_SSH_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/simons
            git fetch origin main
            git reset --hard origin/main      # 박스 로컬 드리프트 무시, main과 정합

            # .env 환경 변수 자동 업데이트 (중복 방지)
            if ! grep -q "NEWSV2_COLLECTION_ENABLED" .env; then
              echo "" >> .env
              echo "# 뉴스 수집 기능 비활성화 — celery worker 자동기동 및 수집/큐 적재 전부 중단" >> .env
              echo "NEWSV2_COLLECTION_ENABLED=false" >> .env
              echo "NEWSV2_WORKER_AUTOSTART_ENABLED=false" >> .env
            fi

            # Keep only the active deployment image. Do not prune volumes; app data may live there.
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true

            docker compose build --pull --force-rm

            # 스키마 마이그레이션 자동 적용 (Supabase Postgres). 이전엔 SQLite라 `prisma migrate`
            # CLI가 막혀 sqlite3로 직접 적용했지만, Postgres 이관 후엔 shadow DB 없이
            # `prisma migrate deploy`가 정상 동작한다. 방금 빌드한 이미지로 1회성 실행해
            # node_modules/schema를 재사용한다(호스트에 node 불필요). 마이그레이션 실패 시
            # set -e로 배포가 중단되고 구버전 컨테이너가 계속 떠 있어 서비스는 죽지 않는다.
            docker compose run --rm --workdir /app backend npx prisma migrate deploy

            docker compose up -d --remove-orphans

            # Remove all build cache and images not used by the newly running containers.
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true

            docker compose ps
